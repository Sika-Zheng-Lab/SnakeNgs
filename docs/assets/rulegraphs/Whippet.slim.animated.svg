<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="100%" version="1.1" viewBox="25.0,5.0,475.0,40.0" width="100%" tabindex="0" role="img" aria-labelledby="flow-title flow-description"><title id="flow-title">Whippet.slim: animated rulegraph</title><desc id="flow-description">Nodes pulse in dependency order; parallel branches may pulse together. This illustrates dependencies, not execution time or live progress. Hover a node or focus this SVG to pause. Reduced-motion preferences disable animation.</desc><style>
.flow-node { transform-box: fill-box; transform-origin: center; animation: rule-pulse 2.40s ease-in-out infinite; }
@keyframes rule-pulse {
  0%, 29.1667%, 100% { transform: scale(1); }
  14.5833% { transform: scale(1.45); }
}
svg:has(.flow-node:hover) .flow-node, svg:focus .flow-node { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .flow-node { animation: none; } }
</style><defs /><g><line stroke="lightgrey" stroke-dasharray="2" x1="50.0" x2="49.0" y1="15.0" y2="15.0" /><line stroke="lightgrey" stroke-dasharray="2" x1="50.0" x2="49.0" y1="35.0" y2="35.0" /></g><g><line stroke="#c65353" stroke-width="2.0" x1="35.0" x2="35.0" y1="15.0" y2="35.0" /></g><g /><g /><g><circle cx="35.0" cy="15.0" fill="#c65353" id="Nquant" r="6.0" stroke="white" stroke-width="2.0" class="flow-node" style="animation-delay: 0.00s" data-level="0" /><text dominant-baseline="middle" fill="#1f2937" font-family="sans-serif" font-size="14" x="55.0" y="15.0">quant</text><circle cx="35.0" cy="35.0" fill="#c6c653" id="Ndelta" r="6.0" stroke="white" stroke-width="2.0" class="flow-node" style="animation-delay: 0.80s" data-level="1" /><text dominant-baseline="middle" fill="#1f2937" font-family="sans-serif" font-size="14" x="55.0" y="35.0">delta</text></g></svg>