<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="100%" version="1.1" viewBox="25.0,5.0,475.0,60.0" width="100%" tabindex="0" role="img" aria-labelledby="flow-title flow-description"><title id="flow-title">STARsolo: animated rulegraph</title><desc id="flow-description">Nodes pulse in dependency order; parallel branches may pulse together. This illustrates dependencies, not execution time or live progress. Hover a node or focus this SVG to pause. Reduced-motion preferences disable animation.</desc><style>
.flow-node { transform-box: fill-box; transform-origin: center; animation: rule-pulse 3.20s ease-in-out infinite; }
@keyframes rule-pulse {
  0%, 21.8750%, 100% { transform: scale(1); }
  10.9375% { transform: scale(1.45); }
}
svg:has(.flow-node:hover) .flow-node, svg:focus .flow-node { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .flow-node { animation: none; } }
